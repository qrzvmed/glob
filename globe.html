
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вращающийся 3D-глобус</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
        }
        h1 {
            margin-bottom: 20px;
        }
        canvas {
            display: block;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            max-width: 90vw;
            max-height: 80vh;
        }
    </style>
</head>
<body>
    <h1>Простой 3D-глобус</h1>
    <!-- Загрузка библиотеки three.js с CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Инициализация сцены, камеры и рендерера
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });

        // Установка размера рендерера и добавление его в DOM
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Создание геометрии и материала для глобуса
        // Геометрия: сфера с радиусом 2 и 64 сегментами (для плавности)
        const geometry = new THREE.SphereGeometry(2, 64, 64);
        // Материал: mesh Lambert, который реагирует на свет
        const material = new THREE.MeshLambertMaterial({ color: 0x3366ff });
        const globe = new THREE.Mesh(geometry, material);
        scene.add(globe);

        // Добавление света, чтобы глобус был виден
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // Установка начальной позиции камеры
        camera.position.z = 5;

        // Переменные для отслеживания вращения с помощью мыши
        let isDragging = false;
        let previousMousePosition = {
            x: 0,
            y: 0
        };

        // Обработчики событий для вращения глобуса с помощью мыши
        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition.x = e.clientX;
            previousMousePosition.y = e.clientY;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const deltaMove = {
                x: e.clientX - previousMousePosition.x,
                y: e.clientY - previousMousePosition.y
            };

            const rotationSpeed = 0.005;
            globe.rotation.y += deltaMove.x * rotationSpeed;
            globe.rotation.x += deltaMove.y * rotationSpeed;

            previousMousePosition = {
                x: e.clientX,
                y: e.clientY
            };
        });

        // Функция анимации
        function animate() {
            // Запрашиваем следующий кадр анимации
            requestAnimationFrame(animate);

            // Автоматическое вращение глобуса (можно закомментировать, если нужно только вращение мышью)
            globe.rotation.y += 0.005;

            // Рендеринг сцены
            renderer.render(scene, camera);
        }

        // Обработчик изменения размера окна для адаптивности
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Запускаем анимационный цикл
        animate();
    </script>
</body>
</html>
