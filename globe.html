
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вращающийся 3D-глобус с текстурой</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            gap: 20px;
        }
        h1 {
            margin: 0;
            font-weight: 300;
        }
        canvas {
            display: block;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            max-width: 90vw;
            max-height: 80vh;
        }
        #loading-text {
            font-size: 1.2rem;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>Вращающийся 3D-глобус</h1>
    <div id="loading-text">Загрузка глобуса...</div>
    <!-- Загрузка библиотеки three.js с CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Инициализация сцены, камеры и рендерера
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });

        // Установка размера рендерера и добавление его в DOM
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Позиционируем камеру
        camera.position.z = 5;

        // Добавление света для освещения сцены
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // Создаем геометрию сферы
        const geometry = new THREE.SphereGeometry(2, 64, 64);
        let globe;

        // **Исправленный** URL-адрес текстуры карты Земли
        const textureUrl = 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg';
        const textureLoader = new THREE.TextureLoader();

        // Отображаем индикатор загрузки
        const loadingText = document.getElementById('loading-text');

        // Загружаем текстуру
        textureLoader.load(
            textureUrl,
            // Функция, вызываемая после успешной загрузки
            (texture) => {
                loadingText.style.display = 'none';
                
                // Создаем материал с текстурой
                const material = new THREE.MeshPhongMaterial({ map: texture });
                globe = new THREE.Mesh(geometry, material);
                scene.add(globe);
                
                // Запускаем анимационный цикл
                animate();
            },
            // Функция-прогресс (необязательно)
            undefined,
            // Функция, вызываемая при ошибке загрузки
            (err) => {
                console.error('Ошибка при загрузке текстуры:', err);
                loadingText.style.display = 'none';
                
                // Создаем одноцветный глобус как запасной вариант
                const fallbackMaterial = new THREE.MeshPhongMaterial({ color: 0x3366ff });
                globe = new THREE.Mesh(geometry, fallbackMaterial);
                scene.add(globe);
                
                // Запускаем анимационный цикл
                animate();
            }
        );

        // Переменные для отслеживания вращения с помощью мыши
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        // Обработчики событий для вращения глобуса
        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition.x = e.clientX;
            previousMousePosition.y = e.clientY;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging || !globe) return;
            
            const deltaMove = {
                x: e.clientX - previousMousePosition.x,
                y: e.clientY - previousMousePosition.y
            };

            const rotationSpeed = 0.005;
            globe.rotation.y += deltaMove.x * rotationSpeed;
            globe.rotation.x += deltaMove.y * rotationSpeed;

            previousMousePosition = {
                x: e.clientX,
                y: e.clientY
            };
        });

        // Основной цикл анимации
        function animate() {
            requestAnimationFrame(animate);

            // Автоматическое вращение, когда глобус не перетаскивают
            if (globe && !isDragging) {
                globe.rotation.y += 0.002;
            }

            renderer.render(scene, camera);
        }

        // Обработчик изменения размера окна для адаптивности
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
