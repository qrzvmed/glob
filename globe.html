
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3D Globe — Three.js</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body { height:100%; margin:0; background:#000; color:#fff; overflow:hidden; }
    #container { width:100%; height:100vh; }
    #info { position:absolute; left:10px; top:10px; z-index:10;
           background:rgba(0,0,0,0.4); padding:8px 12px; border-radius:6px;
           font-family:Arial, sans-serif; font-size:13px; color:#fff; }
    #err { position:absolute; left:10px; right:10px; bottom:10px; z-index:11;
          max-height:180px; overflow:auto; display:none;
          background: rgba(255,0,0,0.06); color:#f88; padding:8px; border-radius:6px;
          font-family:monospace; font-size:12px; }
  </style>

  <!-- three.js and OrbitControls (r150) -->
  <script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.150.1/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="info">Rotate with mouse, wheel to zoom. Click a border to see country name.</div>
  <div id="container"></div>
  <pre id="err"></pre>

<script>
(function(){
  const errBox = document.getElementById('err');
  function showErr(msg){
    errBox.style.display = 'block';
    errBox.textContent += msg + "
";
    console.error(msg);
  }

  if (typeof THREE === 'undefined'){
    showErr('Three.js not loaded.');
    return;
  }

  const container = document.getElementById('container');

  // renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  container.appendChild(renderer.domElement);

  // scene + camera
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 2000);
  camera.position.set(0, 0, 320);

  // lights
  scene.add(new THREE.AmbientLight(0xbbbbbb, 0.9));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight.position.set(100, 100, 100);
  scene.add(dirLight);

  // controls
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enablePan = false;
  controls.enableZoom = true;
  controls.autoRotate = false;
  controls.autoRotateSpeed = 0.6;
  controls.minDistance = 140;
  controls.maxDistance = 800;

  // Earth sphere
  const R = 100;
  const sphereGeo = new THREE.SphereGeometry(R, 64, 64);

  const loader = new THREE.TextureLoader();

  // use remote textures (HTTPS)
  const earthTexture = 'https://unpkg.com/three-globe/example/img/earth-dark.jpg';
  const bumpTexture  = 'https://unpkg.com/three-globe/example/img/earth-topology.png';

  Promise.all([loader.loadAsync(earthTexture), loader.loadAsync(bumpTexture)])
    .then(([mapTex, bumpTex]) => {
      mapTex.encoding = THREE.sRGBEncoding;
      const mat = new THREE.MeshStandardMaterial({
        map: mapTex,
        bumpMap: bumpTex,
        bumpScale: 0.3,
        metalness: 0.0,
        roughness: 1.0
      });
      const earthMesh = new THREE.Mesh(sphereGeo, mat);
      scene.add(earthMesh);
    })
    .catch(err => {
      showErr('Texture load failed: ' + (err && err.message ? err.message : err));
      const fallbackMat = new THREE.MeshStandardMaterial({ color: 0x0a2340 });
      scene.add(new THREE.Mesh(sphereGeo, fallbackMat));
    });

  // borders group
  const bordersGroup = new THREE.Group();
  scene.add(bordersGroup);

  function latLonToVector3(lat, lon, radius){
    const latRad = THREE.MathUtils.degToRad(lat);
    const lonRad = THREE.MathUtils.degToRad(lon);
    const x = radius * Math.cos(latRad) * Math.cos(lonRad);
    const y = radius * Math.sin(latRad);
    const z = radius * Math.cos(latRad) * Math.sin(lonRad);
    return new THREE.Vector3(x, y, z);
  }

  // load geojson
  const geoUrl = 'https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson';
  fetch(geoUrl).then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(geo => {
    if (!geo.features) throw new Error('GeoJSON missing features');
    const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 1, opacity: 0.85 });
    const lineObjects = [];

    geo.features.forEach(feature => {
      const geom = feature.geometry;
      const props = feature.properties || {};
      const name = props.name || props.ADMIN || 'Unknown';
      let polygons = [];
      if (geom.type === 'Polygon') polygons.push(geom.coordinates);
      else if (geom.type === 'MultiPolygon') polygons = polygons.concat(geom.coordinates);
      else return;

      polygons.forEach(polygon => {
        polygon.forEach(ring => {
          const pts = [];
          for (let i = 0; i < ring.length; i++){
            const [lon, lat] = ring[i];
            const v = latLonToVector3(lat, lon, R + 0.9);
            pts.push(v.x, v.y, v.z);
          }
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts), 3));
          const line = new THREE.LineLoop(geometry, lineMaterial.clone());
          line.userData = { name };
          bordersGroup.add(line);
          lineObjects.push(line);
        });
      });
    });

    // raycaster
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    function onClick(e){
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(lineObjects, true);
      if (intersects.length > 0){
        const obj = intersects[0].object;
        const name = obj.userData && obj.userData.name ? obj.userData.name : 'Unknown';
        alert('Country: ' + name);
      }
    }
    renderer.domElement.addEventListener('click', onClick, false);
  }).catch(err => {
    showErr('GeoJSON load failed: ' + (err && err.message ? err.message : err));
  });

  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    renderer.setSize(container.clientWidth, container.clientHeight);
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
  });

  // quick sanity check
  setTimeout(()=> {
    if (!container.querySelector('canvas')) showErr('Canvas not found. Check console for errors.');
  }, 1500);

})();
</script>
</body>
</html>
