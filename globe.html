
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Interactive 3D Globe (Three.js + three-globe)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body { height:100%; margin:0; background:#000; color:#fff; }
    #container { width:100%; height:100vh; display:block; }
    #info { position: absolute; left:10px; top:10px; z-index: 10; background: rgba(0,0,0,0.3); padding:8px 12px; border-radius:6px; font-family:Arial; font-size:13px; }
    #err { position: absolute; left:10px; bottom:10px; right:10px; z-index:11; color:#f88; font-family:monospace; display:none; background: rgba(0,0,0,0.6); padding:8px; border-radius:6px; max-height:200px; overflow:auto; }
  </style>

  <!-- three.js (r150) -->
  <script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
  <!-- OrbitControls (non-ES version) -->
  <script src="https://unpkg.com/three@0.150.1/examples/js/controls/OrbitControls.js"></script>
  <!-- three-globe (UMD build) -->
  <script src="https://unpkg.com/three-globe@2.26.11/dist/three-globe.min.js"></script>
</head>
<body>
  <div id="info">Вращайте мышью, колесо — масштаб. Клик по стране — её название.</div>
  <div id="container"></div>
  <pre id="err"></pre>

<script>
(function(){
  const errBox = document.getElementById('err');
  function showErr(msg){
    errBox.style.display = 'block';
    errBox.textContent += msg + "
";
    console.error(msg);
  }

  // Базовые проверки
  if (typeof THREE === 'undefined') {
    showErr('Three.js не загружен.');
    return;
  }
  if (typeof ThreeGlobe === 'undefined') {
    showErr('three-globe не загружен (ThreeGlobe не определён). Проверь подключение скрипта three-globe.');
    return;
  }

  const container = document.getElementById('container');

  // Сцена, камера, рендерер
  const scene = new THREE.Scene();
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 2000);
  camera.position.set(0, 0, 400);

  // Свет
  scene.add(new THREE.AmbientLight(0xbbbbbb));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight.position.set(40, 40, 100);
  scene.add(dirLight);

  // Контролы
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enablePan = false;
  controls.enableZoom = true;
  controls.autoRotate = false; // можно true
  controls.autoRotateSpeed = 0.6;
  controls.minDistance = 120;
  controls.maxDistance = 800;

  // Создаём ThreeGlobe
  const Globe = new ThreeGlobe()
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
    .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .showAtmosphere(true)
    .atmosphereColor('#3a228a')
    .atmosphereAltitude(0.25)
    .polygonsData([]) // пока пусто
    .polygonCapColor(() => 'rgba(200, 0, 0, 0.35)')
    .polygonSideColor(() => 'rgba(0, 0, 0, 0.15)')
    .polygonStrokeColor(() => '#111')
    .polygonAltitude(0.01)
    .onPolygonHover(d => {
      // handled below
    });

  scene.add(Globe);

  // Подсветка и клик
  let lastHover = null;
  Globe.onPolygonHover(d => {
    lastHover = d;
    Globe.polygonCapColor(f => f === d ? 'rgba(0,200,0,0.6)' : 'rgba(200,0,0,0.35)');
  });

  Globe.onPolygonClick(d => {
    if(!d) return;
    const props = d.properties || {};
    const name = props.name || props.ADMIN || props.NAME || 'Unknown';
    alert('Страна: ' + name);
  });

  // Загружаем GeoJSON границ стран (features array)
  const geoUrl = 'https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson';
  fetch(geoUrl).then(r => {
    if(!r.ok) throw new Error('Ошибка загрузки GeoJSON: ' + r.status);
    return r.json();
  }).then(data => {
    if(data.features && data.features.length){
      Globe.polygonsData(data.features);
    } else {
      showErr('GeoJSON не содержит features.');
    }
  }).catch(err => {
    showErr('Не удалось загрузить GeoJSON: ' + err.message);
  });

  // Анимация
  function animate(){
    requestAnimationFrame(animate);
    // лёгкое автоворочение планеты (если хотите)
    // Globe.rotation.y += 0.0005; // не всегда нужно; можно раскомментировать
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // Resize
  window.addEventListener('resize', () => {
    renderer.setSize(container.clientWidth, container.clientHeight);
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
  });

  // debug: проверим, есть ли canvas
  setTimeout(() => {
    if(!container.querySelector('canvas')) {
      showErr('Canvas не найден — проверьте консоль браузера на другие ошибки (F12 → Console).');
    }
  }, 2000);

})(); // EOF IIFE
</script>
</body>
</html>
