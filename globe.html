
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Interactive 3D Globe</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    // 1. Импортируем все необходимые модули
    import * as THREE from 'https://unpkg.com/three@0.150.1/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.150.1/examples/jsm/controls/OrbitControls.js';
    import ThreeGlobe from 'https://unpkg.com/three-globe/dist/three-globe.mjs';

    // 2. Ваш остальной код остается почти без изменений
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 250;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableZoom = true;
    controls.enablePan = false;
    controls.minDistance = 150;
    controls.maxDistance = 500;
    controls.autoRotate = true; // добавим авто-вращение для красоты
    controls.autoRotateSpeed = 0.5;

    const Globe = new ThreeGlobe()
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
      .showGlobe(true)
      .showAtmosphere(true)
      .atmosphereColor("#3a228a")
      .atmosphereAltitude(0.25);

    scene.add(Globe);

    const ambientLight = new THREE.AmbientLight(0bbbbbb); // немного приглушим свет
    scene.add(ambientLight);
    scene.add(new THREE.DirectionalLight(0xffffff, 0.6));


    function animate() {
      requestAnimationFrame(animate);
      // Globe.rotation.y уже не нужно, так как есть controls.autoRotate
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
