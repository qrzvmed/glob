
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>3D Globe — Three.js (module)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body{height:100%;margin:0;background:#000;color:#fff;overflow:hidden}
    #container{width:100%;height:100vh}
    #info{position:absolute;left:10px;top:10px;z-index:10;background:rgba(0,0,0,0.4);padding:8px 12px;border-radius:6px;font-family:Arial;font-size:13px}
    #err{position:absolute;left:10px;right:10px;bottom:10px;z-index:11;max-height:200px;overflow:auto;display:none;background:rgba(255,0,0,0.06);color:#f88;padding:8px;border-radius:6px;font-family:monospace;font-size:12px}
  </style>
</head>
<body>
  <div id="info">Вращайте мышью, колесико — масштаб. Клик по линии — название страны.</div>
  <div id="container"></div>
  <pre id="err"></pre>

  <script type="module">
  // Импорт модульной сборки three и OrbitControls
  import * as THREE from 'https://unpkg.com/three@0.150.1/build/three.module.js';
  import { OrbitControls } from 'https://unpkg.com/three@0.150.1/examples/jsm/controls/OrbitControls.js';

  const errBox = document.getElementById('err');
  function showErr(msg){
    errBox.style.display = 'block';
    errBox.textContent += msg + "\n";
    console.error(msg);
  }

  // Базовые проверки
  if (!THREE) {
    showErr('Не удалось загрузить three.js');
    throw new Error('three.js not loaded');
  }

  const container = document.getElementById('container');

  // Рендерер
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  container.appendChild(renderer.domElement);

  // Сцена и камера
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 2000);
  camera.position.set(0, 0, 320);

  // Свет
  scene.add(new THREE.AmbientLight(0xbbbbbb, 0.9));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight.position.set(100, 100, 100);
  scene.add(dirLight);

  // Контролы
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enablePan = false;
  controls.enableZoom = true;
  controls.autoRotate = false;
  controls.autoRotateSpeed = 0.6;
  controls.minDistance = 140;
  controls.maxDistance = 800;

  // Планета
  const R = 100;
  const sphereGeo = new THREE.SphereGeometry(R, 64, 64);
  const loader = new THREE.TextureLoader();

  // Обёртка для загрузки текстуры как Promise
  function loadTextureAsync(url){
    return new Promise((resolve, reject) => {
      loader.load(url, tex => resolve(tex), undefined, err => reject(err));
    });
  }

  (async function initTextures(){
    const earthTextureUrl = 'https://unpkg.com/three-globe/example/img/earth-dark.jpg';
    const bumpTextureUrl  = 'https://unpkg.com/three-globe/example/img/earth-topology.png';
    try {
      const [mapTex, bumpTex] = await Promise.all([
        loadTextureAsync(earthTextureUrl),
        loadTextureAsync(bumpTextureUrl)
      ]);
      mapTex.encoding = THREE.sRGBEncoding;
      const mat = new THREE.MeshStandardMaterial({
        map: mapTex,
        bumpMap: bumpTex,
        bumpScale: 0.3,
        metalness: 0.0,
        roughness: 1.0
      });
      const earthMesh = new THREE.Mesh(sphereGeo, mat);
      scene.add(earthMesh);
    } catch(e){
      showErr('Не удалось загрузить текстуры: ' + (e.message || e));
      const fallbackMat = new THREE.MeshStandardMaterial({ color: 0x0a2340 });
      scene.add(new THREE.Mesh(sphereGeo, fallbackMat));
    }
  })();

  // Группа для границ
  const bordersGroup = new THREE.Group();
  scene.add(bordersGroup);

  // Конвертер координат
  function latLonToVector3(lat, lon, radius){
    const phi = (90 - lat) * (Math.PI / 180);
    const theta = (lon + 180) * (Math.PI / 180);
    const x = - (radius) * Math.sin(phi) * Math.cos(theta);
    const z = (radius) * Math.sin(phi) * Math.sin(theta);
    const y = (radius) * Math.cos(phi);
    return new THREE.Vector3(x, y, z);
  }

  // Загружаем GeoJSON (публичный файл)
  const geoUrl = 'https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson';

  try {
    const resp = await fetch(geoUrl);
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const geo = await resp.json();
    if(!geo.features) throw new Error('GeoJSON не содержит features');

    const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 1, opacity: 0.85 });
    const lineObjects = [];

    geo.features.forEach(feature => {
      const geom = feature.geometry;
      const props = feature.properties || {};
      const name = props.name || props.ADMIN || props.NAME || 'Unknown';
      const polys = [];

      if (geom.type === 'Polygon') polys.push(geom.coordinates);
      else if (geom.type === 'MultiPolygon') polys.push(...geom.coordinates);
      else return;

      polys.forEach(polygon => {
        polygon.forEach(ring => {
          const pts = [];
          for (let i = 0; i < ring.length; i++){
            const [lon, lat] = ring[i];
            const v = latLonToVector3(lat, lon, R + 0.9);
            pts.push(v.x, v.y, v.z);
          }
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts), 3));
          const line = new THREE.LineLoop(geometry, lineMaterial.clone());
          line.userData = { name };
          bordersGroup.add(line);
          lineObjects.push(line);
        });
      });
    });

    // Raycaster для кликов
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    function onClick(e){
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(lineObjects, true);
      if (intersects.length > 0){
        const obj = intersects[0].object;
        const name = obj.userData && obj.userData.name ? obj.userData.name : 'Unknown';
        alert('Страна: ' + name);
      }
    }
    renderer.domElement.addEventListener('click', onClick, false);

  } catch(err){
    showErr('Не удалось загрузить GeoJSON: ' + (err.message || err));
  }

  // Анимация
  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // Resize
  window.addEventListener('resize', () => {
    renderer.setSize(container.clientWidth, container.clientHeight);
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
  });

  // sanity
  setTimeout(()=> {
    if(!container.querySelector('canvas')) showErr('Canvas не найден — откройте DevTools → Console для деталей.');
  }, 1500);

  </script>
</body>
</html>
