
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>3D Globe</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: black;
  }
  #globeViz {
    width: 100%;
    height: 100%;
  }
</style>
<!-- Подключаем Three.js и Globe.gl с CDN -->
<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
<script src="https://unpkg.com/globe.gl@4.6.8/dist/globe.gl.min.js"></script>
</head>
<body>
<div id="globeViz"></div>

<script>
// Создаём глобус
const globe = Globe()
  .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
  .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
  .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
  .polygonsData([])
  .polygonCapColor(() => 'rgba(200, 0, 0, 0.4)')
  .polygonSideColor(() => 'rgba(255, 255, 255, 0.15)')
  .polygonStrokeColor(() => '#111')
  .polygonAltitude(() => 0.01)
  .onPolygonHover(hoverD => globe
    .polygonCapColor(d => d === hoverD ? 'rgba(0,255,0,0.6)' : 'rgba(200,0,0,0.4)'));

const globeDiv = document.getElementById('globeViz');
globe(globeDiv);

// Загружаем границы стран
fetch('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson')
  .then(res => res.json())
  .then(countries => {
    globe
      .polygonsData(countries.features)
      .polygonLabel(({ properties: d }) => `
        <b>${d.name}</b>
      `);
  });

// Настройки камеры
globe.controls().enableZoom = true;
globe.controls().autoRotate = true;
globe.controls().autoRotateSpeed = 0.8;
</script>
</body>
</html>
