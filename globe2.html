<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Вращающийся 3D-глобус со странами</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a1a; }
        #canvas-wrap { width: 100vw; height: 100vh; display:flex; justify-content:center; align-items:center; }
        canvas { display: block; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    </style>
</head>
<body>
<div id="canvas-wrap"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('canvas-wrap').appendChild(renderer.domElement);

// Контролы для вращения и зума
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enableZoom = true;

camera.position.z = 5;

// Освещение
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
directionalLight.position.set(5,5,5);
scene.add(directionalLight);

// Сфера-глобус
const geometry = new THREE.SphereGeometry(2, 64, 64);
let globe;
const loader = new THREE.TextureLoader();

// Текстура со всеми странами
loader.load(
    'https://raw.githubusercontent.com/roblabs/3D-globe-textures/main/earth_country_borders.jpg',
    function(texture){
        const material = new THREE.MeshPhongMaterial({ map: texture });
        globe = new THREE.Mesh(geometry, material);
        scene.add(globe);
        animate();
    },
    undefined,
    function(err){ console.error('Ошибка загрузки текстуры:', err); }
);


function animate(){
    requestAnimationFrame(animate);
    if(globe) globe.rotation.y += 0.001; // медленное вращение
    controls.update();
    renderer.render(scene, camera);
}

// Адаптивность
window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
